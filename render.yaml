# Adopt the existing free web service + free Postgres (do not create duplicates).
databases:
  - name: camelot-cipher-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: camelot_cipher_db
    user: camelot_cipher_db_user

services:
  - type: web
    name: avalon-roundtable
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: camelot-cipher-db
          property: connectionString
      - key: NODE_ENV
        value: production
